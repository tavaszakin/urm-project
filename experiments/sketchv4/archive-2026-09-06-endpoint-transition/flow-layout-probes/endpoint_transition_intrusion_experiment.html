<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SketchV4 endpoint-state transition ownership</title>
  <style>
    :root { color-scheme: light; font: 13px/1.45 system-ui, sans-serif; color: #172033; background: #eef2f7; }
    body { margin: 0; }
    header { position: sticky; top: 0; z-index: 5; padding: 12px 16px; background: #fff; border-bottom: 1px solid #cad3df; box-shadow: 0 2px 8px #23304415; }
    h1 { margin: 0 0 6px; font-size: 18px; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 9px; }
    nav a { color: #2457a6; font-weight: 650; }
    .controls { display: flex; align-items: center; gap: 12px; }
    label { display: inline-flex; align-items: center; gap: 5px; }
    #status { margin-top: 7px; color: #536174; }
    main { padding: 14px; }
    #views { display: grid; gap: 14px; }
    article { background: #fff; border: 1px solid #cad3df; border-radius: 8px; overflow: hidden; }
    article h2 { margin: 0; padding: 10px 12px 3px; font-size: 16px; }
    .case-note { margin: 0; padding: 0 12px 8px; color: #475569; }
    .legend { display: flex; flex-wrap: wrap; gap: 7px; padding: 0 12px 9px; }
    .legend span { border-radius: 999px; padding: 2px 8px; color: #fff; font-size: 11px; font-weight: 750; }
    .legend .departure { background: #2563eb; }
    .legend .body { background: #7c3aed; }
    .legend .arrival { background: #059669; }
    .legend .intrusion { background: #dc2626; }
    dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 10px; margin: 0; padding: 0 12px 10px; }
    dt { color: #64748b; font-weight: 650; }
    dd { margin: 0; overflow-wrap: anywhere; }
    code { font: 11px/1.4 ui-monospace, monospace; }
    .good { color: #047857; font-weight: 750; }
    .canvas { max-height: 72vh; overflow: auto; border-block: 1px solid #dde3eb; background: #f8fafc; }
    svg { display: block; background: #fff; }
    .node-label { font-size: 9px; fill: #111827; text-anchor: middle; dominant-baseline: central; }
    .phase-label { font-size: 10px; font-weight: 800; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
    details { padding: 8px 12px 11px; }
    summary { cursor: pointer; font-weight: 650; }
    pre { max-height: 360px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; font: 11px/1.4 ui-monospace, monospace; background: #f7f9fc; border: 1px solid #e1e7ef; padding: 8px; }
    .error { color: #9f1239; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <h1>SketchV4: endpoint-state / segment-phase ownership</h1>
    <nav aria-label="Harness views">
      <a href="./ordinary_halt_experiment.html">Current checkpoint</a>
      <a href="./segment_phase_intrusion_experiment.html">Positional phases</a>
      <a href="./endpoint_transition_intrusion_experiment.html" aria-current="page">Endpoint transitions</a>
      <a href="./history.html">Experiment history</a>
    </nav>
    <div class="controls">
      <label>Scale <input id="scale" type="range" min="0.55" max="1.25" step="0.05" value="0.85" /> <span id="scale-value">0.85×</span></label>
    </div>
    <div id="status">Loading isolated transition views…</div>
  </header>
  <main><div id="views"></div></main>
  <script type="module" src="./endpoint_transition_visual_viewer.mjs"></script>
</body>
</html>
