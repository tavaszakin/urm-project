<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SketchV4 productionization parity</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #11151c; color: #e8edf4; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 880px; }
      header { position: sticky; top: 0; z-index: 2; padding: 14px 18px; background: #151b24ee; border-bottom: 1px solid #334052; backdrop-filter: blur(8px); }
      h1 { margin: 0 0 10px; font-size: 18px; }
      .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
      label { display: grid; gap: 4px; color: #9eabbc; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
      select { min-width: 150px; padding: 7px 9px; color: #ecf3ff; background: #222b38; border: 1px solid #46546a; border-radius: 5px; }
      .toggle { display: flex; flex-direction: row; align-items: center; gap: 7px; padding-bottom: 7px; }
      main { padding: 16px 18px 28px; }
      #status { min-height: 22px; color: #aab8ca; font-size: 13px; }
      #status.fail { color: #ff8d88; }
      .comparison { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
      .card, .overlay-card { overflow: hidden; background: #171e28; border: 1px solid #303c4e; border-radius: 8px; }
      .card h2, .overlay-card h2 { margin: 0; padding: 11px 13px; font-size: 14px; border-bottom: 1px solid #303c4e; }
      .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 13px; padding: 10px 13px; color: #b7c3d2; font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .metrics .wide { grid-column: 1 / -1; overflow-wrap: anywhere; }
      .diagram { height: min(68vh, 720px); min-height: 420px; background: #0f141b; }
      svg { width: 100%; height: 100%; display: block; }
      .overlay-card { margin-top: 14px; }
      .overlay-card .diagram { height: min(70vh, 760px); }
      .hidden { display: none; }
      .legend { margin-left: auto; padding-bottom: 7px; color: #92a0b2; font-size: 11px; }
      .swatch { display: inline-block; width: 12px; height: 3px; margin: 0 4px 2px 10px; vertical-align: middle; }
      .ref { background: #ffb454; } .live { background: #63d3ff; } .same { background: #677385; }
      @media (max-width: 1100px) { .comparison { grid-template-columns: 1fr; } .diagram { height: 560px; } }
    </style>
  </head>
  <body>
    <header>
      <h1>SketchV4 productionization parity — frozen reference vs live harness</h1>
      <div class="controls">
        <label>Fixture<select id="fixture"></select></label>
        <label>Stage<select id="stage"></select></label>
        <label>Focus<select id="focus"></select></label>
        <label class="toggle"><input id="overlay-toggle" type="checkbox" /> geometry-difference overlay</label>
        <div class="legend"><span class="swatch same"></span>identical <span class="swatch ref"></span>reference difference <span class="swatch live"></span>candidate difference</div>
      </div>
    </header>
    <main>
      <div id="status">Loading immutable manifest…</div>
      <section class="comparison">
        <article id="reference-card" class="card"></article>
        <article id="candidate-card" class="card"></article>
      </section>
      <section id="overlay-card" class="overlay-card hidden"></section>
    </main>
    <script type="module" src="./viewer.mjs"></script>
  </body>
</html>
